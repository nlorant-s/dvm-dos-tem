# Calibration configuration file for CMT04 - Shrub Tundra
# PFTs: pft0=Salix, pft1=Betula, pft2=Decid, pft3=EGreen,
#        pft4=Sedges, pft5=Forbs, pft6=Grasses, pft7=Lichens, pft8=Feather

# Used to name the .iterationresults and .finalresults output files
mads_problemname: CMT04_shrub_tundra_cmax_gpp

# Directory where the model run will be conducted and where iteration/final
# results will be copied at the end of the run(s)
work_dir: /data/workflows/calibration/CMT04-Imnavait/cmax_gppallignoringnitrogen/ca

# Path to the "seed" parameter directory. Set this to your project's
# custom parameter directory if you maintain one outside the default.
seed_path: /work/parameters

# Path to the driving input dataset for your site
# TODO: update this to your site's input data path
site: /data/input-catalog/Imnavait

# Pixel from the driving inputs to use
PXx: 0
PXy: 0

# Calibration mode controls which modules are on during the eq stage:
#  - False/None/0: dvmdostem default (dsl and nfeed on for eq, sp, tr, sc)
#  - GPPAllIgnoringNitrogen: turns dsl and nfeed OFF for eq stage
#  - VEGC or NPPAll: turns dsl and nfeed ON for eq (and subsequent) stages
calib_mode: GPPAllIgnoringNitrogen

# Target variable(s) to optimize toward. Names must match calibration_targets.py.
target_names:
- GPPAllIgnoringNitrogen

# Optional additional NetCDF outputs beyond those needed for target comparison.
# WARNING: do not change resolution for any variable that is also a target.
#aux_outputs:
# - VEGC p m
# - AVLN y
# - GPP y p c
# - INGPP m p
# - TLAYER m l

# Community type number being calibrated
cmtnum: 4

# Additional options passed to dvmdostem
opt_run_setup: --pr-yrs 100 --eq-yrs 200 --sp-yrs 0 --tr-yrs 0 --sc-yrs 0

# Parameters to adjust during optimization (one entry per PFT)
params: [cmax, cmax, cmax, cmax, cmax, cmax, cmax, cmax, cmax]

# PFT indices corresponding to each parameter above.
# Use "None" for non-PFT (soil) parameters.
pftnums: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# Initial guesses for MADS optimization.
# Source: CMT04 Shrub Tundra cmax values calibrated for Toolik area (J. Clein, July 2019)
mads_initialguess:
-  210.000  # cmax_pft0  Salix
-  340.000  # cmax_pft1  Betula
-   62.000  # cmax_pft2  Decid
-   13.450  # cmax_pft3  EGreen
-   27.000  # cmax_pft4  Sedges
-   58.000  # cmax_pft5  Forbs
-  110.000  # cmax_pft6  Grasses
-   30.500  # cmax_pft7  Lichens
-   67.000  # cmax_pft8  Feather

# Parameter distributions for MADS. These define the search space for optimization.
# Narrow these if optimization is slow to converge.
mads_paramdist:
- Uniform(  10.500,  409.500)   # cmax_pft0  Salix
- Uniform(  17.000,  663.000)   # cmax_pft1  Betula
- Uniform(   3.100,  120.900)   # cmax_pft2  Decid
- Uniform(   0.672,   26.228)   # cmax_pft3  EGreen
- Uniform(   1.350,   52.650)   # cmax_pft4  Sedges
- Uniform(   2.900,  113.100)   # cmax_pft5  Forbs
- Uniform(   5.500,  214.500)   # cmax_pft6  Grasses
- Uniform(   1.525,   59.475)   # cmax_pft7  Lichens
- Uniform(   3.350,  130.650)   # cmax_pft8  Feather

# Parameter keys used internally by MADS
mads_paramkey:
- cmax_pft0
- cmax_pft1
- cmax_pft2
- cmax_pft3
- cmax_pft4
- cmax_pft5
- cmax_pft6
- cmax_pft7
- cmax_pft8

# Observation weighting, range, and parameter range controls
mads_obsweight: OFF
mads_obsrange: OFF
mads_paramrange: OFF
